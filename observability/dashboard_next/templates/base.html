<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spotiseek Dashboard ({{ env_name }})</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <script src="/static/vendor/htmx.min.js"></script>
</head>
<body>
  <header class="app-header">
    <h1>&#127925; Spotiseek Dashboard <span class="env-badge">{{ env_name }}</span></h1>
    <nav class="tab-nav">
      <a class="tab-link{% if active_tab == 'docs' %} active{% endif %}"
         href="/docs/overview"
         hx-get="/docs/overview"
         hx-target="#tab-content"
         hx-push-url="true">&#128214; Docs</a>
    </nav>
  </header>
  <main id="tab-content">
    {% include content_template %}
  </main>
</body>
</html>
