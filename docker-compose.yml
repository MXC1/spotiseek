services:
  slskd:
    environment:
      - SLSKD_REMOTE_CONFIGURATION=true
      - SLSKD_USERNAME=${SLSKD_USERNAME}
      - SLSKD_PASSWORD=${SLSKD_PASSWORD}
      - SLSKD_SLSK_USERNAME=${SLSKD_USERNAME}
      - SLSKD_SLSK_PASSWORD=${SLSKD_PASSWORD}
    volumes:
      - ./slskd_docker_data/${APP_ENV}:/app:rw
      - ./slskd_docker_data/slskd.yml:/app/slskd.yml:ro
    ports:
      - 5030:5030/tcp
      - 5031:5031/tcp
      - 127.0.0.1:54300:50300/tcp
    image: slskd/slskd:latest
    restart: unless-stopped

  # The Spotiseek dashboard (FastAPI + HTMX) -- see
  # docs/adr/0003-dashboard-rewrite-fastapi-htmx.md. Started life as a temporary
  # parallel service (docs/adr/0004-dashboard-migration-parallel-service-cutover.md)
  # alongside the old Streamlit dashboard; that migration is complete
  # (docs/adr/0006-complete-dashboard-cutover.md) and this is now the only dashboard.
  # Code is mounted via ${CODE_ROOT}, same as `workflow`: for the gated environment, it
  # only changes through `invoke deploy`, never just by being the hot environment -- see
  # docs/adr/0002-gated-environment-deploys-via-git-archive.md.
  dashboard:
    build:
      context: .
      dockerfile: infra/Dockerfile.dashboard
    ports:
      - "8501:8501"
    environment:
      - APP_ENV=${APP_ENV}
      - HOST_BASE_PATH=${HOST_BASE_PATH}
      - SLSKD_BASE_URL=http://slskd:5030
      - TOKEN=${TOKEN}
    volumes:
      - ./output:/app/output:rw
      - ./slskd_docker_data/${APP_ENV}/imported:/app/slskd_docker_data/${APP_ENV}/imported:rw
      # Read-only view of downloads/ so the Database tab's file checks can see the files most
      # tracks record (their paths are .../downloads/...). Deliberately NOT mounted at that
      # recorded path: the Blacklist tab deletes files at their recorded path, so a read-only
      # mount there would make it fail outright and a read-write one would make it start
      # deleting files it currently silently skips. Keep in sync with DOWNLOADS_VIEW_DIR in
      # observability/dashboard/config.py (docs/adr/0008-dashboard-database-explorer.md).
      - ./slskd_docker_data/${APP_ENV}/downloads:/mnt/spotiseek/downloads:ro
      - ${CODE_ROOT}/observability/dashboard:/app/observability/dashboard:ro
      - ./observability/logs:/app/observability/logs:rw
      - ./docs:/app/docs:ro
      - ./README.md:/app/README.md:ro
      - ${CODE_ROOT}/scripts:/app/scripts:ro
      # Docker socket: lets the Execution Inspection tab stream every other container's
      # live logs (workflow, slskd, backup, itself) via `docker logs -f`. This is a real
      # privilege escalation for a web-facing container -- socket access is effectively
      # root on the host -- accepted here because this dashboard isn't exposed beyond the
      # host/LAN. If that ever changes, put the dashboard behind auth first.
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  workflow:
    build:
      context: .
      dockerfile: infra/Dockerfile.workflow
    environment:
      - APP_ENV=${APP_ENV}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}
      - TOKEN=${TOKEN}
      - SLSKD_BASE_URL=http://slskd:5030
      - HOST_BASE_PATH=${HOST_BASE_PATH}
      - PREFER_MP3=${PREFER_MP3}
    volumes:
      - ./output:/app/output:rw
      - ./input_playlists:/app/input_playlists:rw
      - ./slskd_docker_data/${APP_ENV}:/app/slskd_docker_data/${APP_ENV}:rw
      - ./observability/logs:/app/observability/logs:rw
      - ${CODE_ROOT}/scripts:/app/scripts:ro
    depends_on:
      - slskd
    restart: unless-stopped

  backup:
    build:
      # Always builds from the deployed snapshot (never the working tree), regardless of
      # which environment is hot -- see docs/adr/0002-gated-environment-deploys-via-git-archive.md.
      context: ./.deploy/deployed-code
      dockerfile: infra/Dockerfile.backup
    environment:
      - LOG_LEVEL=${LOG_LEVEL}
      - BACKUP_RESTIC_PASSWORD=${BACKUP_RESTIC_PASSWORD}
      - BACKUP_SCHEDULE_ENVS=${BACKUP_SCHEDULE_ENVS}
      - BACKUP_SCHEDULE_HOUR=${BACKUP_SCHEDULE_HOUR}
      - BACKUP_QUIET_MINUTES=${BACKUP_QUIET_MINUTES}
      - BACKUP_SCHEDULE_TIMEZONE=${BACKUP_SCHEDULE_TIMEZONE}
      - BACKUP_KEEP_DAILY=${BACKUP_KEEP_DAILY}
      - BACKUP_KEEP_WEEKLY=${BACKUP_KEEP_WEEKLY}
      - BACKUP_KEEP_MONTHLY=${BACKUP_KEEP_MONTHLY}
    volumes:
      # Docker socket: lets this container pause/resume slskd + workflow
      # around a consistent copy of whichever environment is currently hot.
      - /var/run/docker.sock:/var/run/docker.sock
      # Every environment's data, read-write (restore needs to write back).
      - ./slskd_docker_data:/app/slskd_docker_data:rw
      - ./output:/app/output:rw
      - ./observability/logs:/app/observability/logs:rw
      - ./input_playlists:/app/input_playlists:rw
      # Shared config, backed up verbatim into every environment's repo.
      - ./.env:/app/.env:ro
      # Restic repositories, one per environment. Host path is BACKUP_DEST;
      # the container always sees it at the fixed /backups mount point.
      - ${BACKUP_DEST}:/backups:rw
    restart: unless-stopped